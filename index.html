<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List App</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />

    <!--json file for pwa-->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#5c5cdb" />
  </head>
  <body>
    <div class="container">
      <div class="todo-app">
        <h1>To-Do App</h1>
        <div class="stat-container">
          <div class="details">
            <h3>You Got This!!</h3>
            <div id="progressbar">
              <div id="progress"></div>
            </div>
          </div>
          <div class="stats-number">
            <p id="numbers">0 / 0</p>
          </div>
        </div>
        <form class="input-area">
          <input type="text" id="task-input" placeholder="Add a new task..." />
          <!--add dropdown to be able to select category-->
          <select id="task-category"></select>
          <!--add buttons to be able to edit the added categories-->
          <button type="button" id="edit-category-btn" title="Edit category">
            <i class="fa-solid fa-pen"></i>
          </button>
          <!--add buttons to delete categories that are not used-->
          <button
            type="button"
            id="delete-category-btn"
            title="Delete category"
          >
            <i class="fa-solid fa-trash"></i>
          </button>
          <!--add to row a place where user can categorize task-->
          <div id="new-category-row" class="new-category-row">
            <!--add an input area for user to name category and assign a color to it, start with a default color as a placeholder-->
            <input
              type="text"
              id="new-category-name"
              placeholder="Category name"
            />
            <input type="color" id="new-category-color" value="#94a3b8" />
            <!--add a button to be able to add category-->
            <button type="button" id="confirm-category-btn">Add</button>
          </div>
          <input type="date" id="task-date" />
          <!--added a date picker field-->
          <button type="button" id="add-task-btn">
            <i class="fa-solid fa-plus"></i>
          </button>
        </form>

        <div class="main-content">
          <div class="todos-container">
            <ul id="task-list"></ul>
            <img class="empty-image" src="snoopy.png" alt="empty" />
          </div>
          <!--create a calander container next to do do list-->
          <div class="calender-container">
            <div class="calender-header">
              <button id="prev-month">&lt</button>
              <h2 id="month-year-display"></h2>
              <button id="next-month">&gt</button>
            </div>
            <div class="calender-weekdays">
              <div>Sun</div>
              <div>Mon</div>
              <div>Tue</div>
              <div>Wed</div>
              <div>Thu</div>
              <div>Fri</div>
              <div>Sat</div>
            </div>
            <div id="calender-days" class="calender-days"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
    <script src="https://unpkg.com/canvas-confetti@1.6.0/dist/confetti.browser.js"></script>
    <script>
      if ("serviceWorker" in navigator)
        navigator.serviceWorker.register("sw.js");
    </script>
  </body>
</html>
